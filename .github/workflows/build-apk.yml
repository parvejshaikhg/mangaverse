name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies (Ubuntu 22.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev python3-pip

      - name: Install Buildozer & Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade "buildozer>=1.5.0" "cython<3.0" virtualenv

      - name: Build APK with Buildozer
        run: |
          buildozer android debug
          mkdir -p release_bin
          cp bin/*.apk release_bin/MangaVerse.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaVerse-Android-APK
          path: release_bin/MangaVerse.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_bin/MangaVerse.apk
          name: MangaVerse Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
