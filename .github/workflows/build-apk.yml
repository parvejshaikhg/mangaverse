name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p release_bin
          cp android/app/build/outputs/apk/debug/*.apk release_bin/MangaVerse.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaVerse-Android-APK
          path: release_bin/MangaVerse.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "MangaVerse v2.0.0 (Android APK)"
          files: release_bin/MangaVerse.apk
          draft: false
          prerelease: false
          generate_release_notes: true
